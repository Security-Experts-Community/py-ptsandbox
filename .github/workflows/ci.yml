name: Lint & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Keep lint tooling on a Python version with prebuilt dependency wheels.
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check ptsandbox/

      - name: Ruff format check
        run: uv run ruff format --check ptsandbox/

      - name: Mypy
        run: uv run mypy --strict ptsandbox/
