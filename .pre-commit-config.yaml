default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff-check
        files: ^ptsandbox/.*\.py$
      # Run the formatter.
      - id: ruff-format
        files: ^ptsandbox/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pydantic, aiohttp, aiohttp-socks, orjson]
        files: ^ptsandbox/.*\.py$
        verbose: true
