[project]
site_name = "ptsandbox"
site_url = "https://security-experts-community.github.io/py-ptsandbox"
repo_url = "https://github.com/Security-Experts-Community/py-ptsandbox"
repo_name = "py-ptsandbox"
watch = ["ptsandbox/"]

nav = [
    { "Overview" = "index.md" },
    { "Usage" = [
        { "Proxy" = "usage/proxy.md" },
        { "Detections" = "usage/detections.md" },
        { "Public API" = [
            { "Scanning" = [
                { "Scan" = "usage/public-api/scanning/scan.md" },
                { "Rescan" = "usage/public-api/scanning/rescan.md" },
                { "Debug Options" = "usage/public-api/scanning/debug-options.md" },
                { "Sources" = "usage/public-api/scanning/source.md" },
            ] },
            { "Get available images" = "usage/public-api/image-info.md" },
            { "Extract email headers" = "usage/public-api/email.md" },
            { "Download files" = "usage/public-api/download-files.md" },
            { "System info" = "usage/public-api/system.md" },
            { "Tasks" = "usage/public-api/tasks.md" },
        ] },
        { "UI API" = [
            { "Authorization" = "usage/ui-api/authorization.md" },
            { "API Tokens" = "usage/ui-api/api-tokens.md" },
            { "Antiviruses" = "usage/ui-api/antiviruses.md" },
            { "Artifacts" = "usage/ui-api/artifacts.md" },
            { "BAqueue" = "usage/ui-api/baqueue.md" },
            { "Download files" = "usage/ui-api/download-files.md" },
            { "Entry Points" = "usage/ui-api/entry-points.md" },
            { "License" = "usage/ui-api/license.md" },
            { "System" = "usage/ui-api/system.md" },
            { "Tasks" = "usage/ui-api/tasks.md" },
        ] },
    ] },
    { "API Reference" = [
        { "ptsandbox" = "api-reference/ptsandbox.md" },
        { "ptsandbox.exceptions" = "api-reference/exceptions.md" },
        { "ptsandbox.models" = "api-reference/models.md" },
        { "ptsandbox.sandbox" = "api-reference/sandbox.md" },
        { "Public API client" = "api-reference/public-api.md" },
        { "UI API client" = "api-reference/ui-api.md" },
        { "ptsandbox.utils" = "api-reference/utils.md" },
    ] },
]

[project.theme]
language = "en"
logo = "assets/main_logo_no_text.svg"
favicon = "assets/main_logo_no_text.svg"
features = [
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "navigation.instant",
    "navigation.expand",
    "navigation.sections",
    "navigation.top",
]
variant = "modern"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "white"
toggle = { "name" = "Light", "icon" = "material/toggle-switch-off" }

[[project.theme.palette]]
scheme = "slate"
primary = "black"
toggle = { "name" = "Dark", "icon" = "material/toggle-switch" }

[project.plugins.search]
lang = ["en"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
show_signature_annotations = true
separate_signature = true
show_bases = true
members_order = "source"
heading_level = 2
docstring_section_style = "list"

[project.plugins.redirects.redirect_maps]
"usage/ui-api/cluster.md" = "usage/ui-api/system.md"
"usage/ui-api/components.md" = "usage/ui-api/system.md"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."admonition"]

[project.markdown_extensions."attr_list"]

[project.markdown_extensions."md_in_html"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.superfences"]
